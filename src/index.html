<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Diseño web en Alicante para negocios locales — MakeWeb</title>
    <meta
      name="description"
      content="Estudio de diseño y desarrollo web en Alicante para negocios locales de toda España. Webs a medida, rápidas y con SEO local: más llamadas, reservas y clientes."
    />
    <meta name="theme-color" content="#111111" />
    <meta name="author" content="MakeWeb" />
    <link rel="canonical" href="https://makeweb.es/" />

    <!-- El título, la descripción, la canónica y og:url los reescribe
         `SeoStrategy` en cada página; estas son las de la portada y el valor de
         reserva. Lo que sí es común a todas se queda aquí.

         og:image va con la dirección completa a propósito: las tarjetas de
         WhatsApp, Telegram y LinkedIn no resuelven rutas relativas, así que con
         "/brand/..." el enlace se compartía sin imagen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MakeWeb" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://makeweb.es/" />
    <meta property="og:title" content="Diseño web en Alicante para negocios locales — MakeWeb" />
    <meta
      property="og:description"
      content="Diseñamos y desarrollamos la web de tu negocio local en una semana. Rápida, accesible y hecha para convertir visitas en clientes."
    />
    <meta property="og:image" content="https://makeweb.es/brand/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MakeWeb — webs para negocios locales" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://makeweb.es/brand/og-cover.png" />

    <!-- Todos derivados de logotipo.png, recortado a los bordes reales del
         isotipo. Los de pestaña van con fondo transparente; los de pantalla de
         inicio, sobre el #111 de la marca y con margen para el recorte
         redondeado que aplican iOS y Android. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Sin <link rel="preload"> para las fuentes: el empaquetador les pone un
         hash en el nombre, así que no hay una ruta estable a la que apuntar. No
         se pierde nada, porque el @font-face viaja dentro del CSS crítico que
         Angular incrusta en esta misma cabecera: el navegador se entera de la
         fuente mientras lee el <head>, igual que con una precarga. -->

    <!-- Los datos estructurados (la empresa, el sitio, las migas de pan y lo
         propio de cada página) los escribe `SeoStrategy` en `core/seo.ts`, en
         el idioma de cada página. Aquí iban fijos y en castellano. -->
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div style="padding: 4rem 1.5rem; color: #fff; background: #111; font-family: sans-serif">
        <!-- Sin <h1>: Google lee este bloque y la página ya tiene el suyo. -->
        <p><strong>MakeWeb</strong></p>
        <p>
          Diseño y desarrollo web en Alicante para negocios locales. Activa JavaScript para ver la experiencia completa o
          escríbenos a <a style="color: #8d84ff" href="mailto:contacto&#64;makeweb.es">contacto&#64;makeweb.es</a>.
        </p>
      </div>
    </noscript>
  </body>
</html>
