<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>MakeWeb — Webs para negocios locales que aparecen primero</title>
    <meta
      name="description"
      content="Estudio web en remoto para negocios locales de toda España. Webs rápidas, medibles y preparadas para SEO local: más llamadas, más reservas, más clientes."
    />
    <meta name="theme-color" content="#111111" />
    <meta name="author" content="MakeWeb" />
    <link rel="canonical" href="https://makeweb.es/" />

    <!-- El título, la descripción, la canónica y og:url los reescribe
         `SeoStrategy` en cada página; estas son las de la portada y el valor de
         reserva. Lo que sí es común a todas se queda aquí.

         og:image va con la dirección completa a propósito: las tarjetas de
         WhatsApp, Telegram y LinkedIn no resuelven rutas relativas, así que con
         "/brand/..." el enlace se compartía sin imagen. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MakeWeb" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://makeweb.es/" />
    <meta property="og:title" content="MakeWeb — Webs para negocios locales que aparecen primero" />
    <meta
      property="og:description"
      content="Diseñamos y desarrollamos la web de tu negocio local en una semana. Rápida, accesible y hecha para convertir visitas en clientes."
    />
    <meta property="og:image" content="https://makeweb.es/brand/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MakeWeb — webs para negocios locales" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://makeweb.es/brand/og-cover.png" />

    <!-- Todos derivados de logotipo.png, recortado a los bordes reales del
         isotipo. Los de pestaña van con fondo transparente; los de pantalla de
         inicio, sobre el #111 de la marca y con margen para el recorte
         redondeado que aplican iOS y Android. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Sin <link rel="preload"> para las fuentes: el empaquetador les pone un
         hash en el nombre, así que no hay una ruta estable a la que apuntar. No
         se pierde nada, porque el @font-face viaja dentro del CSS crítico que
         Angular incrusta en esta misma cabecera: el navegador se entera de la
         fuente mientras lee el <head>, igual que con una precarga. -->

    <!-- Organization y no LocalBusiness: el estudio trabaja en remoto y no
         tiene local al que ir, así que declarar dirección o geolocalización
         sería falso y no ayudaría a posicionar. Lo que sí es cierto y útil es
         que atiende a toda España. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MakeWeb",
        "description": "Estudio de diseño y desarrollo web para negocios locales. En remoto, para toda España.",
        "url": "https://makeweb.es/",
        "logo": "https://makeweb.es/brand/logotipo-entero.png",
        "email": "contacto@makeweb.es",
        "telephone": ["+34683106846", "+34617845264"],
        "areaServed": { "@type": "Country", "name": "España" },
        "knowsLanguage": ["es"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Diseño web" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Desarrollo web" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO local" } }
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+34683106846",
          "email": "contacto@makeweb.es",
          "areaServed": "ES",
          "availableLanguage": "es"
        }
      }
    </script>

    <!-- Declara el nombre con el que la web quiere aparecer en los resultados.
         Sin esto, Google se inventa el nombre del sitio a partir del dominio. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MakeWeb",
        "url": "https://makeweb.es/",
        "inLanguage": "es-ES",
        "publisher": { "@type": "Organization", "name": "MakeWeb" }
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div style="padding: 4rem 1.5rem; color: #fff; background: #111; font-family: sans-serif">
        <h1>MakeWeb</h1>
        <p>
          Diseñamos webs para negocios locales. Activa JavaScript para ver la experiencia completa o
          escríbenos a <a style="color: #8d84ff" href="mailto:contacto&#64;makeweb.es">contacto&#64;makeweb.es</a>.
        </p>
      </div>
    </noscript>
  </body>
</html>
