<header class="bar" #bar [class.is-condensed]="condensed()" [class.is-open]="menuOpen()">
  <div class="bar__inner" data-bar-inner>
    <!-- El fondo de la píldora vive en su propio elemento porque tiene que
         poder encogerse hasta convertirse en el círculo que rodea el aspa de
         cerrar, y estirarse de vuelta al cerrar el menú. Si fuese el fondo de
         `.bar__inner` arrastraría con él al logotipo y al botón. -->
    <span class="bar__shell" data-bar-shell aria-hidden="true"></span>

    <a
      class="bar__brand"
      data-bar-brand
      href="#inicio"
      (click)="go($event, 'inicio')"
      aria-label="MakeWeb, ir al inicio"
    >
      <img
        class="bar__logo"
        src="/brand/logotipo-entero.png"
        alt="MakeWeb"
        width="900"
        height="228"
      />
    </a>

    <nav class="bar__nav" aria-label="Secciones">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="link.route ?? '#' + link.id"
              [class.is-active]="active() === link.id"
              [attr.aria-current]="active() === link.id ? 'true' : null"
              (click)="go($event, link.id, link.route)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="bar__end">
      <!-- Con el menú abierto este botón no está: su sitio lo ocupa el último
           elemento de la lista. `inert` lo saca también del tabulador. -->
      <a
        class="btn btn--primary bar__cta"
        data-bar-cta
        href="#contacto"
        (click)="go($event, 'contacto')"
        [attr.inert]="menuOpen() ? '' : null"
        [mwMagnetic]="16"
      >
        <span class="btn__label" data-magnetic-inner>
          <span class="bar__cta-long">Pide presupuesto</span>
          <span class="bar__cta-short">Presupuesto</span>
        </span>
      </a>

      <button
        class="bar__burger"
        data-bar-burger
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-principal"
      >
        <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
        <span class="bar__burger-lines" [class.is-open]="menuOpen()" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>
</header>

<div class="menu" id="menu-principal" #panel [attr.inert]="menuOpen() ? null : ''">
  <div class="menu__sheet" data-menu-sheet>
    <nav class="menu__nav" aria-label="Menú principal">
      <ul>
        @for (link of links; track link.id; let i = $index) {
          <li>
            <a [href]="link.route ?? '#' + link.id" (click)="go($event, link.id, link.route)">
              <span data-menu-item>
                <em>{{ pad(i + 1) }}</em>
                {{ link.label }}
              </span>
            </a>
          </li>
        }

        <!-- El botón de presupuesto baja aquí como última opción. Sustituye al
             enlace "Contacto", que llevaba exactamente al mismo sitio. -->
        <li class="menu__cta-item">
          <!-- Entra como una pieza entera, no con la etiqueta deslizándose por
               dentro: es un botón relleno, y verlo llegar vacío durante medio
               segundo parecía que estaba cargando. -->
          <a
            class="btn btn--primary menu__cta"
            data-menu-cta
            href="#contacto"
            (click)="go($event, 'contacto')"
          >
            <span class="btn__label">Pide presupuesto</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="menu__meta" data-menu-meta>
      <a href="mailto:contacto@makeweb.es">contacto&#64;makeweb.es</a>
      <a href="tel:+34600000000">+34 600 00 00 00</a>
      <p>Lunes a viernes, 9:00 – 18:00</p>
    </div>
  </div>
</div>
