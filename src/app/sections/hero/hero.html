<section class="hero" id="inicio" #root>
  <!-- Una tarjeta enmarcada con la luz de la marca y el isotipo dibujado en
       línea, el mismo recurso que las cabeceras de las páginas interiores.
       Sin foto: el titular es lo primero que se pinta. -->
  <div class="hero__stage">
    <svg class="hero__mark" [attr.viewBox]="markViewBox" aria-hidden="true">
      @for (d of markPaths; track $index) {
        <path [attr.d]="d" />
      }
    </svg>

    <div class="hero__inner">
      <h1 class="hero__title" data-hero-title i18n>
        Webs que te traen <em>clientes, no solo visitas.</em>
      </h1>

      <div class="hero__foot">
        <div class="hero__pitch">
          <!-- La entradilla lleva lo que se busca («diseño web en Alicante»): el
               titular habla de lo que se gana, y Google necesita leer de qué va
               la página en lo primero que se ve. -->
          <p class="hero__lead" data-hero-lead i18n>
            Diseño y desarrollo web en Alicante y toda España: webs a medida que cargan al instante
            y salen en Google.
          </p>

          <div class="hero__actions">
            <a
              class="btn btn--primary btn--go"
              routerLink="/contacto"
              data-hero-action
            >
              <span class="btn__label" i18n>Pide presupuesto</span>
            </a>

            <a class="btn btn--ghost" routerLink="/precios" data-hero-action>
              <span class="btn__label" i18n>Ver precios</span>
            </a>
          </div>
        </div>

        <!-- Dos datos, y los dos se pueden comprobar: el plazo es el del
             proceso y el precio es el suelo de la tarifa más baja. -->
        <dl class="hero__facts">
          <div class="hero__fact" data-hero-fact>
            <dt i18n>7 días</dt>
            <dd i18n>de la primera llamada a la web publicada</dd>
          </div>
          <div class="hero__fact" data-hero-fact>
            <dt i18n>desde 350 €</dt>
            <dd i18n>con el precio cerrado antes de empezar</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</section>
