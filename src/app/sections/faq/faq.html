<section class="faq sec" id="preguntas">
  <div class="shell faq__inner">
    <div class="faq__aside">
      <div class="sec-head">
        <h2 class="sec-title" i18n>Preguntas <em>frecuentes.</em></h2>
        <p class="sec-lead" i18n>
          Si falta la tuya, escríbenos y te contestamos en menos de 24 horas.
        </p>
      </div>
    </div>

    <mat-accordion class="faq__list" [multi]="false">
      <span class="faq__rule" aria-hidden="true"></span>

      @for (item of faqs; track item.q; let i = $index) {
        <mat-expansion-panel
          class="faq__row"
          [expanded]="open() === i"
          (opened)="open.set(i)"
          (closed)="onClosed(i)"
          hideToggle
        >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <span class="faq__q">
                <span class="faq__index">{{ pad(i + 1) }}</span>
                {{ item.q }}
              </span>
              <span class="faq__sign" [class.is-open]="open() === i" aria-hidden="true"></span>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <p class="faq__a">{{ item.a }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</section>
