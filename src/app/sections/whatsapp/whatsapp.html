@if (visible()) {
  <div class="wa">
    @if (open()) {
      <div class="wa__sheet" id="wa-sheet" data-wa-panel role="menu" aria-label="Elige con quién hablas"
        i18n-aria-label>
        <mw-whatsapp-lines />
      </div>
    }

    <button
      class="wa__toggle"
      data-wa-toggle
      data-wa-trigger
      type="button"
      (click)="toggle()"
      [class.is-open]="open()"
      [attr.aria-expanded]="open()"
      aria-controls="wa-sheet"
      [attr.aria-label]="open() ? labels.close : labels.open"
    >
      <ng-icon class="wa__glyph" name="simpleWhatsapp" aria-hidden="true" />
    </button>
  </div>
}
